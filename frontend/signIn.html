<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="discription" content="my template4" />
  <title>Sign In</title>
  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/all.min.css" />
  <!-- file project -->
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/lire.css" />
  <link rel="stylesheet" href="css/sign.css" />
</head>

<body>
  <div class="container">
    <h1>تسجيل الدخول</h1>
    <form>
      <div class="input-container">
        <label for="email">الحساب</label>
        <input type="text" name="email" id="email" required />
      </div>
      <div class="input-container">
        <label for="password">كلمة المرور</label>
        <input type="password" name="password" id="password" required />
      </div>
      <label class="sign-btn" for="submit">
        <div class="overlay-10"></div>
        <input type="submit" id="submit" value="تسجيل الدخول"/>
      </label>
    </form>
    <div class="links">
      <a href="#">نسيت كلمة المرور؟</a>
      <a href="signUp.html">إنشاء حساب جديد</a>
    </div>
  </div>
  <script>
    
    document.forms[0].addEventListener("submit", (e) => {
      e.preventDefault();
      console.log(9)
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      fetch("http://localhost:4001/signin", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ email, password }),
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.token) {
            localStorage.setItem("token", data.token)
            open("index.html", "_self")
          } else {
            alert("Invalid credentials. Please try again.");
          }
        })
        .catch((error) => console.error("Error:", error));
    })
  </script>
</body>

</html>
