<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="discription" content="my template4" />
  <title>Sign Up</title>
  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/all.min.css" />
  <!-- file project -->
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/lire.css" />
  <link rel="stylesheet" href="css/sign.css" />
  <style>
    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      background-color: white;
      color: white;
      width: 60px;
      height: 60px;
      cursor: pointer;
      font-size: 16px;
      display: inline-block;
      align-self: left;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>انشاء حساب</h1>
    <form action="index.html" method="post">
      <div class="upload-container">
        <label for="file-upload" class="custom-file-upload">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </label>
        <input id="file-upload" type="file" accept="image/*" />
      </div>

      <div class="input-container">
        <label for="username">الاسم</label>
        <input type="text" name="username" id="username" required />
      </div>
      <div class="input-container">
        <label for="username">الحساب</label>
        <input type="text" name="username" id="username" required />
      </div>
      <div class="input-container">
        <label for="password">كلمة المرور</label>
        <input type="password" name="password" id="password" required />
      </div>
      <div class="input-container">
        <label for="password">تاكيد كلمة المرور</label>
        <input type="password" name="password" id="password" required />
      </div>
      <div class="sign-btn">
        <div class="overlay-10"></div>
        <input type="submit" value="تسجيل الدخول" />
      </div>
    </form>
    <div class="links">
      <a href="signUp.html">تسجيل دخول</a>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>

</html>
