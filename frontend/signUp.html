<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="discription" content="my template4" />
  <title>Sign Up</title>
  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/all.min.css" />
  <!-- file project -->
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/lire.css" />
  <link rel="stylesheet" href="css/sign.css" />
  <style>
    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      background-color: white;
      color: black;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      margin-bottom: 5px;
      position: relative;
    }

    img {
      width: auto;
      height: 100%;
      position: absolute;
      display: none;

    }
  </style>
</head>

<body>
  <div class="container">
    <h1>انشاء حساب</h1>
    <form action="index.html" method="post">
      <div class="upload-container">
        <label for="file-upload" class="custom-file-upload">
          <i class="fa-solid fa-image"></i>
          <img src="" alt="">
        </label>
        <input id="file-upload" type="file" accept="image/*" />
      </div>

      <div class="input-container">
        <label for="username">الاسم</label>
        <input type="text" name="username" id="username" required />
      </div>
      <div class="input-container">
        <label for="username">الحساب</label>
        <input type="text" name="username" id="username" required />
      </div>
      <div class="input-container">
        <label for="password">كلمة المرور</label>
        <input type="password" name="password" id="password" required />
      </div>
      <div class="input-container">
        <label for="confirmPassword">تاكيد كلمة المرور</label>
        <input type="password" name="confirmPassword" id="confirmPassword" required />
      </div>
      <label class="sign-btn" for="submit">
        <div class="overlay-10"></div>
        <input id="submit" type="submit" value="تسجيل الدخول" />
      </label>
    </form>
    <div class="links">
      <a href="signIn.html">تسجيل دخول</a>
    </div>
  </div>
  <script>
    document.getElementById("file-upload").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        const imgElement = document.querySelector(".custom-file-upload");
        reader.onload = function (event) {
          const imgElement = document.querySelector(".upload-container img");
          imgElement.src = event.target.result;
          imgElement.style.display = "block";
          imgElement.parentElement.style.backgroundColor = "transparent";
        };
        reader.readAsDataURL(file);
      }
    });
    document.forms[0].addEventListener("submit", (e) => {
      e.preventDefault();
      if (document.querySelector('#confirmPassword').value == password) {
        const password = document.getElementById("password").value;
        const email = document.getElementById("email").value;
        const username = document.getElementById("username").value;
        const img = document.querySelector("img").src;
        fetch("http://localhost:4001/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password, username, img }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.token) {
              localStorage.setItem("token", data.token)
              open("index.html", "_self")
            } else {
              alert("Invalid credentials. Please try again.");
            }
          })
          .catch((error) => console.error("Error:", error));
      }
    })
  </script>
</body>

</html>
